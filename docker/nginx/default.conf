server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # ─── Laravel health check ───────────────────────────────────────────────
    # /up ni SPA egallab olmasligi uchun oldinroq aniqlanadi
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # ─── SPA (React frontend build) ─────────────────────────────────────────
    # public/spa/ ga qurilgan frontend. Barcha yo'nalishlar /api ga
    # tegishli bo'lmasa SPA ga tushadi (client-side routing uchun fallback).
    location / {
        root /var/www/public/spa;
        try_files $uri $uri/ /index.html;
    }

    # ─── Laravel API ────────────────────────────────────────────────────────
    location /api {
        try_files $uri /index.php?$query_string;
    }

    # ─── Mahsulot rasmlari (storage symlink) ────────────────────────────────
    location /storage/ {
        try_files $uri =404;
    }

    # ─── PHP (Laravel index.php) ────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
